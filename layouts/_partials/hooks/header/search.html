{{- $page := .page -}}
<div class="docs-site-search" data-pagefind-ignore="all">
  <pagefind-config bundle-path="{{ "pagefind/" | relURL }}" base-url="{{ $page.Site.Home.RelPermalink }}"></pagefind-config>
  <pagefind-searchbox placeholder="Search documentation" show-sub-results></pagefind-searchbox>
  <noscript><p class="white-90">Search needs JavaScript. <a class="white-90" href="{{ $page.Site.Home.RelPermalink }}">Browse the documentation index</a>.</p></noscript>
</div>
