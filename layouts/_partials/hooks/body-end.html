{{- /* Documentation code copying excludes rendered line numbers. */ -}}
<script>
  (function () {
    "use strict";

    document.querySelectorAll(".code-copy[hidden]").forEach(function (button) {
      button.hidden = false;
    });

    function copyFrom(button) {
      var container = button.closest(".code-block");
      if (!container) return;
      // Table-style line numbers have their own first <pre>; copy only the code column.
      var source = container.querySelector(".lntd:last-child code") ||
        container.querySelector("pre code") || container.querySelector("pre");
      if (!source) return;
      var codeOnly = source.cloneNode(true);
      codeOnly.querySelectorAll(".ln, .lnt").forEach(function (number) {
        number.remove();
      });
      // textContent preserves source newlines without layout-generated blank lines.
      var text = codeOnly.textContent;

      var done = function () {
        var label = button.querySelector(".code-copy-label");
        var previous = label ? label.textContent : null;
        button.classList.add("is-copied");
        if (label) label.textContent = "Copied";
        window.setTimeout(function () {
          button.classList.remove("is-copied");
          if (label && previous !== null) label.textContent = previous;
        }, 2000);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {});
      }
    }

    document.addEventListener("click", function (event) {
      var button = event.target.closest(".code-copy");
      if (button) copyFrom(button);
    });
  })();
</script>
