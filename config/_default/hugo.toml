baseURL = "https://gohugo-ananke.github.io/documentation/"
locale = "en-gb"
title = "Ananke Documentation"
# Crawlers use /robots.txt at the domain root, not /documentation/robots.txt.
# The gohugo-ananke.github.io repository manages the root site's robots.txt.
enableRobotsTXT = false

# Keep this filename stable: the root site's sitemap index links to it.
[sitemap]
filename = "sitemap.xml"

# Show the theme's automatic table of contents on all regular pages.
[[cascade]]
[cascade.params]
toc = true
[cascade.target]
kind = 'page'
