[build]
  # Production serves permanent redirects, without building a duplicate site.
  publish = "netlify/redirects"
  command = "echo 'Production redirects to GitHub Pages'"

[build.environment]
  # Hugo version verified for the documentation build
  HUGO_VERSION = "0.170.1"
  NODE_VERSION = "24"
  HUGO_ENV = "production"

[context.deploy-preview]
  # Build with the preview URL for Pull Requests
  command = "npm run build:preview -- --buildFuture"
  publish = "public"

[context.branch-deploy]
  # Build settings for non-production branches
  command = "npm run build:preview"
  publish = "public"

# All content served by Netlify is for review, not search indexing.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
